name: Release

on:
  push:
    tags:
      - 'v*'
      - '*-v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore keystore and google services
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p composeApp/src/release

          # Keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > composeApp/src/release/Yourday_key.jks

          # google-services
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > composeApp/src/release/google-services.json

          # keystore.properties
          echo "storeFile=composeApp/src/release/Yourday_key.jks" > keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties

      - name: Determine Release Type
        run: |
          TAG="$GITHUB_REF_NAME"
          CLEAN_VERSION="${TAG#v}"

          # Check for beta tag
          if [[ "$CLEAN_VERSION" == *-beta* ]]; then
            IS_BETA=true
            CLEAN_VERSION="${CLEAN_VERSION/-beta/}"
          else
            IS_BETA=false
          fi

          VERSION_NAME="${CLEAN_VERSION/-mobile/}"
          VERSION_NAME="${VERSION_NAME/-v/}"
          RELEASE_TITLE="Your Day v${VERSION_NAME}"

          if [ "$IS_BETA" = "true" ]; then
            RELEASE_TITLE="${RELEASE_TITLE} (Beta)"
          fi

          echo "IS_BETA=$IS_BETA" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> "$GITHUB_ENV"

      - name: Debug Version Info
        run: |
          echo "Tag: $GITHUB_REF_NAME"
          echo "Version: $VERSION_NAME"
          echo "Is Beta: $IS_BETA"
          echo "Release Title: $RELEASE_TITLE"

      - name: Create local.properties
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TODOIST_CLIENT_ID: ${{ secrets.TODOIST_CLIENT_ID }}
          TODOIST_CLIENT_SECRET: ${{ secrets.TODOIST_CLIENT_SECRET }}
        run: |
          echo "API_KEY=$API_KEY" > local.properties
          echo "TODOIST_CLIENT_ID=$TODOIST_CLIENT_ID" >> local.properties
          echo "TODOIST_CLIENT_SECRET=$TODOIST_CLIENT_SECRET" >> local.properties

      - name: Release Build
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Prepare Release Notes
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')

          # GitHub Release (with date)
          echo "# $RELEASE_TITLE" > release_notes.md
          echo "" >> release_notes.md
          echo "Released: $RELEASE_DATE" >> release_notes.md
          echo "" >> release_notes.md
          cat whatsnew.md >> release_notes.md

          # Play Store (without date)
          mkdir -p whatsnew
          sed 's/^## //' whatsnew.md | head -c 500 > whatsnew/whatsnew-en-US

      - name: Upload To Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.charan.yourday
          releaseFile: composeApp/build/outputs/bundle/release/*.aab
          track: internal
          inAppUpdatePriority: 5
          whatsNewDirectory: whatsnew

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_TITLE }}
          prerelease: ${{ env.IS_BETA == 'true' }}
          body_path: release_notes.md
          files: composeApp/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f keystore.properties
          rm -f local.properties
          rm -f composeApp/src/release/Yourday_key.jks
          rm -f composeApp/src/release/google-services.json
